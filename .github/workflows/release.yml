name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.0.2
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      # Never version or publish a manifest whose dependencies point at local files.
      - run: node scripts/assert-publishable.ts
      # Keep the maintained Changesets 2 npm publisher: v3 selects Yarn, whose bundled
      # provenance client fails this release with a duplicate transparency-log entry.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0; CLI 2-compatible
        with:
          version: corepack yarn changeset version
          publish: corepack yarn changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
