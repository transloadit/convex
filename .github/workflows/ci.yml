name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: '*.tgz'

  biome:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint

  typescript:
    name: Lint (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 24
          - 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test

  example:
    name: Build wedding example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn example:build

  browser:
    name: Browser tests
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - name: Ensure Transloadit secrets
        run: |
          missing=()
          if [ -z "${TRANSLOADIT_KEY}" ]; then
            missing+=("TRANSLOADIT_KEY")
          fi
          if [ -z "${TRANSLOADIT_SECRET}" ]; then
            missing+=("TRANSLOADIT_SECRET")
          fi
          if [ -z "${TRANSLOADIT_R2_CREDENTIALS}" ]; then
            if [ -z "${R2_BUCKET}" ] || [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || { [ -z "${R2_HOST}" ] && [ -z "${R2_ACCOUNT_ID}" ]; } || [ -z "${R2_PUBLIC_URL}" ]; then
              missing+=("TRANSLOADIT_R2_CREDENTIALS (or R2_* variables)")
            fi
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi
        env:
          TRANSLOADIT_KEY: ${{ secrets.TRANSLOADIT_KEY }}
          TRANSLOADIT_SECRET: ${{ secrets.TRANSLOADIT_SECRET }}
          TRANSLOADIT_R2_CREDENTIALS: ${{ secrets.TRANSLOADIT_R2_CREDENTIALS }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_HOST: ${{ secrets.R2_HOST }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      - name: Check hosted Chrome
        run: |
          set -euo pipefail
          echo "::group::Browser test diagnostics"
          node --version
          yarn --version
          google-chrome --version
          df -h
          echo "::endgroup::"
      - name: Run local browser verification
        run: timeout --foreground 12m yarn verify:local
        env:
          PLAYWRIGHT_SKIP_INSTALL: "1"
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          TRANSLOADIT_KEY: ${{ secrets.TRANSLOADIT_KEY }}
          TRANSLOADIT_SECRET: ${{ secrets.TRANSLOADIT_SECRET }}
          TRANSLOADIT_R2_CREDENTIALS: ${{ secrets.TRANSLOADIT_R2_CREDENTIALS }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_HOST: ${{ secrets.R2_HOST }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

  convex-qa:
    name: Convex deployment QA
    if: >
      github.ref != 'refs/heads/main' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - name: Compute preview deployment name
        id: preview_name
        run: |
          preview_name="$(node scripts/slugify-branch.ts)"
          echo "name=${preview_name}" >> "$GITHUB_OUTPUT"
      - name: Deploy Convex preview
        run: |
          timeout --foreground 12m node scripts/deploy-cloud.ts >> "$GITHUB_ENV"
        env:
          CI_OUTPUT: "1"
          CONVEX_PREVIEW_NAME: ${{ steps.preview_name.outputs.name }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          TRANSLOADIT_KEY: ${{ secrets.TRANSLOADIT_KEY }}
          TRANSLOADIT_SECRET: ${{ secrets.TRANSLOADIT_SECRET }}
          TRANSLOADIT_R2_CREDENTIALS: ${{ secrets.TRANSLOADIT_R2_CREDENTIALS }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_HOST: ${{ secrets.R2_HOST }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      - name: Resolve Vercel preview URL
        if: env.E2E_REMOTE_APP_URL == ''
        run: |
          preview_url="$(timeout --foreground 7m node scripts/resolve-vercel-preview.ts)"
          echo "Resolved Vercel preview URL: ${preview_url}"
          echo "E2E_REMOTE_APP_URL=${preview_url}" >> "$GITHUB_ENV"
        env:
          VERCEL_PREVIEW_DEPLOY_HOOK: ${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK }}
          VERCEL_PROJECT_SLUG: convex
          VERCEL_TEAM_SLUG: transloadit-com
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Ensure cloud QA secrets
        run: |
          missing=()
          if [ -z "${E2E_REMOTE_APP_URL}" ]; then
            missing+=("E2E_REMOTE_APP_URL")
          fi
          if [ -z "${VERCEL_PROTECTION_BYPASS}" ]; then
            missing+=("VERCEL_PROTECTION_BYPASS")
          fi
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -z "${CONVEX_PREVIEW_DEPLOY_KEY}" ]; then
            missing+=("CONVEX_PREVIEW_DEPLOY_KEY")
          fi
          if [ -z "${E2E_REMOTE_CONVEX_URL}" ]; then
            missing+=("E2E_REMOTE_CONVEX_URL")
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi
        env:
          E2E_REMOTE_APP_URL: ${{ env.E2E_REMOTE_APP_URL }}
          E2E_REMOTE_CONVEX_URL: ${{ env.E2E_REMOTE_CONVEX_URL }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
      - name: Run cloud verification
        run: timeout --foreground 12m yarn verify:cloud
        env:
          E2E_REMOTE_APP_URL: ${{ env.E2E_REMOTE_APP_URL }}
          E2E_REMOTE_CONVEX_URL: ${{ env.E2E_REMOTE_CONVEX_URL }}
          PLAYWRIGHT_SKIP_INSTALL: "1"
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

  deploy-example:
    name: Deploy and verify production example
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: convex-production
      cancel-in-progress: false
    needs:
      - pack
      - biome
      - typescript
      - unit
      - example
      - browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - name: Deploy demo Convex backend
        run: node scripts/deploy-demo.ts
        env:
          CI_OUTPUT: "1"
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_REMOTE_CONVEX_URL: ${{ secrets.E2E_REMOTE_CONVEX_URL }}
          TRANSLOADIT_KEY: ${{ secrets.TRANSLOADIT_KEY }}
          TRANSLOADIT_SECRET: ${{ secrets.TRANSLOADIT_SECRET }}
          TRANSLOADIT_R2_CREDENTIALS: ${{ secrets.TRANSLOADIT_R2_CREDENTIALS }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_HOST: ${{ secrets.R2_HOST }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      - name: Deploy Vercel and wait for the new production build
        run: timeout --foreground 8m node scripts/deploy-vercel.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      - name: Verify the live production gallery
        run: timeout --foreground 12m yarn verify:cloud
        env:
          E2E_REMOTE_APP_URL: ${{ secrets.E2E_REMOTE_APP_URL }}
          E2E_REMOTE_CONVEX_URL: ${{ secrets.E2E_REMOTE_CONVEX_URL }}
          PLAYWRIGHT_SKIP_INSTALL: "1"
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
