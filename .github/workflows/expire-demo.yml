name: Expire demo Storage photos

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report only; do not hide or delete photos
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  expire:
    if: github.ref == 'refs/heads/main' && vars.TRANSLOADIT_WORKSPACE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: convex-production
      cancel-in-progress: false
    env:
      CONVEX_URL: ${{ secrets.E2E_REMOTE_CONVEX_URL }}
      # A deployment deploy key is also its admin key; reuse the existing production secret.
      CONVEX_ADMIN_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      TRANSLOADIT_KEY: ${{ secrets.TRANSLOADIT_KEY }}
      TRANSLOADIT_SECRET: ${{ secrets.TRANSLOADIT_SECRET }}
      TRANSLOADIT_WORKSPACE: ${{ vars.TRANSLOADIT_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - name: Verify the production namespace and report expiry selection
        run: yarn demo:cleanup --older-than=24 --expected-prefix=convex-demo/little-aardvark-87/wedding-gallery/ --dry-run
      - name: Expire photos and drain the retry ledger
        if: github.event_name == 'schedule' || !inputs.dry-run
        run: yarn demo:cleanup --older-than=24 --expected-prefix=convex-demo/little-aardvark-87/wedding-gallery/
