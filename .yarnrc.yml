nodeLinker: node-modules

# The hosted example must consume the released package, even when this workspace has that version.
enableTransparentWorkspaces: false

# Exact releases admitted before the default age gate for the hosted Storage integration.
# Everything else waits.
npmPreapprovedPackages:
  - "@transloadit/viewer@0.1.0"
  - "@transloadit/utils@4.10.1"
  - "@transloadit/zod@5.0.1"
  - "@transloadit/node@5.0.1"
  - "@transloadit/convex@0.6.1"
